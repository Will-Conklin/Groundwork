[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundwork"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.23",
    "polars>=1.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "altair>=5.0",
    "loguru>=0.7",
    "mlflow>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.15",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["groundwork"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
